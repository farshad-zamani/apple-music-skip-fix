name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m ruff check src tests tools
      - run: python tools/prepare_build.py
      - run: python -m PyInstaller --noconfirm --clean packaging/AppleMusicSkipFix.spec
      - run: choco install innosetup --no-progress -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss'
      - run: python tools/package_release.py
      - run: ./tools/smoke_release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/*-Setup.exe
            dist/*-Portable.zip
            dist/SHA256SUMS.txt
            build/package-qa.json
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/*-Setup.exe dist/*-Portable.zip dist/SHA256SUMS.txt --draft --title "Apple Music Skip Fix ${{ github.ref_name }}" --notes-file CHANGELOG.md
