[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-music-skip-fix"
version = "0.1.0"
description = "A preservation-first Windows repair assistant for Apple Music track skipping."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "farshad-zamani"}]
dependencies = ["PySide6-Essentials==6.12.0", "defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "pyinstaller>=6.16,<7", "pillow>=11"]

[project.scripts]
apple-music-skip-fix = "amsf.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amsf = ["resources/*", "scripts/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
